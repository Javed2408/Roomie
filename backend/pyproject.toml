# Tool configuration for the Roomie backend.
# Dependencies live in requirements.txt; this file only configures tools.

[tool.ruff]
target-version = "py311"
line-length = 100
# Migration files are generated by Alembic and reviewed by hand; their long
# lines of SQL are not worth reformatting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused names, undefined variables),
# I: import ordering, B: common bug patterns, UP: outdated syntax,
# S: security checks.
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
# The local "alembic/" folder holds migrations; "alembic" itself is an
# installed package and should be sorted with the other third-party imports.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain "assert" statements and made-up passwords, both of which
# the security rules flag in real application code. Long descriptive test
# names are also allowed to run past the line limit.
"tests/**" = ["S101", "S105", "S106", "E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() is designed to be used as a default argument value.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the PostgreSQL container to be running",
]
