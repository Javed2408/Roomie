# Local development services for Roomie.
#
# Only PostgreSQL runs in Docker. The frontend and backend run directly on
# your computer so that code changes reload instantly.
#
# Values such as ${POSTGRES_USER} are read from the ".env" file next to this
# file. The ":?" form makes Docker Compose stop with a clear message if a
# value is missing, instead of starting a database with an empty password.

name: roomie

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the .env file}
    ports:
      # "127.0.0.1:" means only this computer can reach the database, not
      # other devices on the same Wi-Fi network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A named volume keeps the data when the container is stopped or rebuilt.
      - roomie_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roomie_db_data:
